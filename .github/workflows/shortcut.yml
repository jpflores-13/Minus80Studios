name: shortcut CI

on:
  push:
    branches: [main]
    paths: ['shortcut/**', '.github/workflows/shortcut.yml']
  pull_request:
    paths: ['shortcut/**', '.github/workflows/shortcut.yml']

permissions:
  contents: read

defaults:
  run:
    working-directory: shortcut

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: shortcut/.node-version
          cache: npm
          cache-dependency-path: shortcut/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npx vite build
      - uses: actions/upload-artifact@v7
        with:
          name: shortcut-web-build
          path: shortcut/dist/
          retention-days: 14
