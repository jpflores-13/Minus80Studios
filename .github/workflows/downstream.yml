name: downstream CI

on:
  push:
    branches: [main]
    paths: ['downstream/**', '.github/workflows/downstream.yml']
  pull_request:
    paths: ['downstream/**', '.github/workflows/downstream.yml']

permissions:
  contents: read

defaults:
  run:
    working-directory: downstream

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: downstream/.node-version
          cache: npm
          cache-dependency-path: downstream/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npx vite build
      - uses: actions/upload-artifact@v7
        with:
          name: downstream-web-build
          path: downstream/dist/
          retention-days: 14
