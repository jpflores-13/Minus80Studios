name: muck-life CI

on:
  push:
    branches: [main]
    paths: ['muck-life/**', '.github/workflows/muck-life.yml']
  pull_request:
    paths: ['muck-life/**', '.github/workflows/muck-life.yml']

permissions:
  contents: read

defaults:
  run:
    working-directory: muck-life

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: muck-life/.node-version
          cache: npm
          cache-dependency-path: muck-life/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npx vite build
      - uses: actions/upload-artifact@v7
        with:
          name: muck-life-web-build
          path: muck-life/dist/
          retention-days: 14
