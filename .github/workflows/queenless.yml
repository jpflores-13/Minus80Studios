name: queenless CI

on:
  push:
    branches: [main]
    paths: ['queenless/**', '.github/workflows/queenless.yml']
  pull_request:
    paths: ['queenless/**', '.github/workflows/queenless.yml']

permissions:
  contents: read

defaults:
  run:
    working-directory: queenless

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: queenless/.node-version
          cache: npm
          cache-dependency-path: queenless/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npx vite build
      - uses: actions/upload-artifact@v7
        with:
          name: queenless-web-build
          path: queenless/dist/
          retention-days: 14
