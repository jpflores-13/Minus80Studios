name: snail-assassin CI

on:
  push:
    branches: [main]
    paths: ['snail-assassin/**', '.github/workflows/snail-assassin.yml']
  pull_request:
    paths: ['snail-assassin/**', '.github/workflows/snail-assassin.yml']

permissions:
  contents: read

defaults:
  run:
    working-directory: snail-assassin

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: snail-assassin/.node-version
          cache: npm
          cache-dependency-path: snail-assassin/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npx vite build
      - uses: actions/upload-artifact@v7
        with:
          name: snail-assassin-web-build
          path: snail-assassin/dist/
          retention-days: 14
