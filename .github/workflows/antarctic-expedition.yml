name: antarctic-expedition CI

on:
  push:
    branches: [main]
    paths: ['antarctic-expedition/**', '.github/workflows/antarctic-expedition.yml']
  pull_request:
    paths: ['antarctic-expedition/**', '.github/workflows/antarctic-expedition.yml']

permissions:
  contents: read

defaults:
  run:
    working-directory: antarctic-expedition

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: antarctic-expedition/.node-version
          cache: npm
          cache-dependency-path: antarctic-expedition/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npx vite build
      - uses: actions/upload-artifact@v7
        with:
          name: antarctic-expedition-web-build
          path: antarctic-expedition/dist/
          retention-days: 14
