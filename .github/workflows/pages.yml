name: Publish games

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: snail-assassin/.node-version
      - name: Build Snail Assassin
        working-directory: snail-assassin
        run: npm ci && npx vite build
      - name: Build Downstream!
        working-directory: downstream
        run: npm ci && npx vite build
      - name: Build OFF TARGET.
        working-directory: off-target
        run: npm ci && npx vite build
      - name: Build DR. ANTI-CRISPR
        working-directory: dr-anti-crispr
        run: npm ci && npx vite build
      - name: Build STARSTRUCK.
        working-directory: starstruck
        run: npm ci && npx vite build
      - name: Build HEIST.
        working-directory: heist
        run: npm ci && npx vite build
      - name: Assemble site
        run: |
          mkdir -p _site
          cp site/index.html _site/
          cp -r snail-assassin/dist _site/snail-assassin
          cp -r downstream/dist _site/downstream
          cp -r off-target/dist _site/off-target
          cp -r dr-anti-crispr/dist _site/dr-anti-crispr
          cp -r starstruck/dist _site/starstruck
          cp -r heist/dist _site/heist
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
