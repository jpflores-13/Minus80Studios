name: heist CI

on:
  push:
    branches: [main]
    paths: ['heist/**', '.github/workflows/heist.yml']
  pull_request:
    paths: ['heist/**', '.github/workflows/heist.yml']

permissions:
  contents: read

defaults:
  run:
    working-directory: heist

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: heist/.node-version
          cache: npm
          cache-dependency-path: heist/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npx vite build
      - uses: actions/upload-artifact@v7
        with:
          name: heist-web-build
          path: heist/dist/
          retention-days: 14
