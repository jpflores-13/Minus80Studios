<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>-80 Studios</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #06192b;
        color: #eef6f3;
        font-family: system-ui, sans-serif;
        text-align: center;
      }
      h1 { font-family: Georgia, serif; font-size: 4rem; margin: 0; }
      p { color: #9fc0c8; }
      .games { display: flex; gap: 1.5rem; flex-wrap: wrap; justify-content: center; margin: 2rem 0; }
      a.game {
        display: block;
        width: 260px;
        padding: 1.5rem;
        border: 2px solid #5fd3c6;
        border-radius: 10px;
        color: inherit;
        text-decoration: none;
      }
      a.game:hover { background: #0a2a3f; }
      a.game.green { border-color: #6f9a52; }
      small { color: #7fa8b5; }
    </style>
  </head>
  <body>
    <main>
      <h1>-80</h1>
      <p>STUDIOS · Inspired by real discoveries</p>
      <div class="games">
        <a class="game" href="./snail-assassin/">
          <h2>Snail Assassin</h2>
          <small>Hunt the reef as a venomous cone snail.<br />Keyboard + mouse.</small>
        </a>
        <a class="game green" href="./downstream/">
          <h2>Downstream!</h2>
          <small>Stop litter before it reaches the ocean.<br />Mouse or touch.</small>
        </a>
      </div>
      <p><small>Early playtest builds. Your progress is saved in this browser only.</small></p>
    </main>
  </body>
</html>
